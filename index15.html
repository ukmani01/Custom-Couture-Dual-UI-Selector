        .spinner { display: none; width: 20px; height: 20px; border: 3px solid #cbd5e1; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }

                    <h1>Basic XML, DTD & Parsers</h1>
                    <p><strong>XML (eXtensible Markup Language)</strong> looks like HTML, but it is NOT used to display data. XML is used to <strong>store and transport data</strong>.</p>

                    <h2>1. XML Structure</h2>

                    <pre style="background:var(--bg-dark); color:white; padding:1.5rem; border-radius:8px; margin: 1rem 0; font-family: monospace;">
&lt;student&gt;

    &lt;age&gt;20&lt;/age&gt;
    &lt;department&gt;IT&lt;/department&gt;
&lt;/student&gt;</pre>

                    <h2>2. DTD & XML Schema</h2>
                    <p>How do we ensure that every <code>&lt;student&gt;</code> file has a <code>&lt;name&gt;</code> tag? We use rules.</p>
                    <ul>
                        <li><strong>DTD (Document Type Definition):</strong> Defines the structure and legal elements of an XML document.</li>
                        <li><strong>XML Schema:</strong> A more modern, powerful, and XML-based alternative to DTD.</li>

                    <h2>3. XML Parsers and XSL</h2>
                    <p>An <strong>XML Parser</strong> is a software module that reads an XML document, checks its structure, and allows programs to extract the data.</p>
                    <p><strong>XSL (eXtensible Stylesheet Language)</strong> is used to transform XML data into readable formats like HTML pages.</p>

                    <h2>1. Express.js</h2>
                    <p>Node.js alone requires a lot of setup to handle web requests. <strong>Express</strong> is a fast, minimalist framework for Node.js that makes creating APIs (Routes) incredibly easy.</p>

                    <h2>2. Firebase</h2>
                    <p><strong>Firebase</strong> is a Google platform that provides ready-made backend services. Instead of building your own database and login system from scratch, Firebase offers Realtime Databases and Authentication as a service.</p>

                    <h2>3. Docker</h2>
                    <p>A huge problem in development is: <em>"It works on my laptop, but crashes on the server!"</em></p>
                    <p><strong>Docker</strong> solves this by packing the application and all its dependencies into a standard unit called a <strong>Container</strong>. It runs identically everywhere.</p>
                    <div class="tamil-note">
                        <span>🍱</span>
                        <div>
                            <strong>Tamil Understanding:</strong> Docker ஒரு Lunch Box மாதிரி. சாப்பாடு, ஸ்பூன், சட்னி எல்லாத்தையும் ஒரே Box-குள்ள pack பண்ணிடுவோம். அதை School-க்கு கொண்டு போனாலும், Office-க்கு கொண்டு போனாலும் அதே டேஸ்ட், அதே setup தான் இருக்கும்.
                        </div>
                    </div>

                    <h2>4. Django (Python Framework)</h2>
                    <p>While Node.js/Express use JavaScript on the backend, <strong>Django</strong> is a high-level web framework written in <strong>Python</strong>. It follows a "batteries-included" philosophy, providing everything (admin panel, database ORM, security) out of the box.</p>

                    <div class="teacher-tip">
                        <strong>Summarize Unit 5:</strong><br>
                        Frontend: AngularJS or React<br>
                        Backend Server: PHP/Laravel OR Node.js/Express OR Python/Django<br>
                        Database/Cloud: Firebase or SQL/XML data<br>
                        Deployment: Docker
                    </div>
                `
            }
        ];

        let completed = [];
        let isClassroom = false;

        function initApp() {
            renderMenu();
            renderTopic(1);
            updateProgress();
        }

        function renderMenu() {
            const menu = document.getElementById('nav-menu');
            menu.innerHTML = `
                <div class="nav-link" onclick="renderHome()">🏠 Unit 05 Overview</div>
                <div style="height:1px; background:var(--border); margin:10px 0;"></div>
            `;
            syllabusData.forEach(topic => {
                const isDone = completed.includes(topic.id) ? '✓ ' : '';
                menu.innerHTML += `<div class="nav-link" id="nav-${topic.id}" onclick="renderTopic(${topic.id})">${isDone}${topic.id}. ${topic.title}</div>`;
            });
        }

        function renderHome() {
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            
            let gridHtml = '';
            syllabusData.forEach(t => {
                const doneClass = completed.includes(t.id) ? 'done' : '';
                const doneMark = completed.includes(t.id) ? '<span style="color:var(--success)">✓</span>' : '';
                gridHtml += `
                    <div class="topic-card ${doneClass}" onclick="renderTopic(${t.id})">
                        <div class="topic-num">0${t.id}</div>
                        <div class="topic-title">${t.title} ${doneMark}</div>
                        <p style="font-size:0.9rem; margin:0;">${t.desc}</p>
                    </div>
                `;
            });

            document.getElementById('main-content').innerHTML = `
                <span style="background:#f3e8ff; color:#7c3aed; padding:4px 10px; border-radius:6px; font-size:0.85rem; font-weight:700;">UNIT 05</span>
                <h1 style="margin-top:1rem; font-size: 3rem;">PHP, XML & Modern Web Frameworks</h1>
                <p style="font-size:1.1rem; max-width:700px;">Explore the full spectrum of modern web development. From foundational server-side PHP and structured XML data, to dynamic frontends using Angular/React, and powerful backends utilizing Node.js, Django, Firebase, and Docker.</p>
                
                <h2 style="margin-top:3rem;">What You'll Learn</h2>
                <div class="topic-grid">
                    ${gridHtml}
                </div>
            `;
            renderFooterActions(null);
        }

        function renderTopic(id) {
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${id}`);
            if(activeNav) activeNav.classList.add('active');

            const topic = syllabusData.find(t => t.id === id);
            document.getElementById('main-content').innerHTML = `
                <span style="background:#f3e8ff; color:#7c3aed; padding:4px 10px; border-radius:6px; font-size:0.85rem; font-weight:700;">TOPIC 0${topic.id}</span>
                ${topic.content}
            `;
            window.scrollTo(0, 0);
            renderFooterActions(id);
        }

        function renderFooterActions(currentId) {
            const footer = document.getElementById('nav-actions');
            if(!currentId) {
                footer.innerHTML = `<button class="btn btn-primary" onclick="renderTopic(1)">Start Learning →</button>`;
                return;
            }

            const isDone = completed.includes(currentId);
            const nextTopic = syllabusData.find(t => t.id === currentId + 1);
            const prevTopic = syllabusData.find(t => t.id === currentId - 1);

            let html = '';
            if(prevTopic) html += `<button class="btn btn-outline" onclick="renderTopic(${prevTopic.id})">← Previous</button>`;
            
            if(isDone) {
                html += `<button class="btn btn-outline" style="border-color:var(--success); color:var(--success);">✓ Completed</button>`;
            } else {
                html += `<button class="btn btn-primary" onclick="markDone(${currentId})">Mark as Complete ✓</button>`;
            }

            if(nextTopic) {
                html += `<button class="btn btn-outline" onclick="renderTopic(${nextTopic.id})">Next Topic →</button>`;
            } else {
                html += `<button class="btn btn-primary" onclick="renderHome()">Finish Unit 🏆</button>`;
            }

            footer.innerHTML = html;
        }

        function markDone(id) {
            if(!completed.includes(id)) {
                completed.push(id);
                updateProgress();
                renderMenu();
                renderFooterActions(id);
            }
        }

        function updateProgress() {
            const pct = Math.round((completed.length / syllabusData.length) * 100);
            document.getElementById('prog-text').innerText = pct + '% Completed';
            document.getElementById('prog-ring').style.background = `conic-gradient(var(--success) ${pct}%, var(--border) 0%)`;
        }

        function toggleClassroom() {
            isClassroom = !isClassroom;
            if(isClassroom) {
                document.body.classList.add('classroom-mode');
            } else {
                document.body.classList.remove('classroom-mode');
            }
        }

        /* SIMULATION FUNCTIONS */
        
        // Topic 1: PHP Simulation
        function simPHP() {
            const user = document.getElementById('php-sim-input').value;
            const spinner = document.getElementById('php-spinner');
            const out = document.getElementById('php-out');
            
            spinner.style.display = 'block';
            out.innerHTML = '';
            
            setTimeout(() => {
                spinner.style.display = 'none';
                if(user.trim() === '') {
                    out.innerHTML = `<span style="color:#ef4444; font-weight:600;">Error: Name cannot be empty!</span>`;
                } else {
                    out.innerHTML = `<span style="color:var(--success); font-weight:600;">Welcome back, ${user}</span>`;
                }
            }, 800);
        }

        // Topic 3: Angular Data Binding Simulation
        function simAngular() {
            const user = document.getElementById('angular-sim-input').value;
            const out = document.getElementById('angular-out');
            out.innerText = user === '' ? '...' : user;
        }

        // Topic 4: React / Node.js API Simulation
        function simFetch() {
            const spinner = document.getElementById('react-spinner');
            const status = document.getElementById('react-status');
            const out = document.getElementById('react-out');
            
            spinner.style.display = 'block';
            status.innerText = "React -> Sending GET Request to Node.js backend...";
            out.style.display = 'none';
            out.innerText = '';
            
            setTimeout(() => {
                spinner.style.display = 'none';
                status.innerText = "200 OK (Node.js JSON Response Received)";
                out.style.display = 'block';
                out.innerText = `{
  "status": "success",
  "data": {
    "user": "Manikandan",
    "role": "Frontend Engineer",
    "skills": ["React JS", "Node.js"]
  }
}`;
            }, 1500);
        }

        window.onload = initApp;
    </script>
</body>
</html>
