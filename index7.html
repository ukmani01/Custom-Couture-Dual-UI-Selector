<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 04: Server-Side Programming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* DESIGN SYSTEM & FOUR-CORNER LAYOUT */
        :root {
            --bg-main: #ffffff;
            --bg-subtle: #f8fafc;
            --bg-dark: #0f172a;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --teacher-bg: #fefce8;
            --teacher-border: #fde047;
            --font-main: 'Inter', sans-serif;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-main); color: var(--text-main); background: var(--bg-main); line-height: 1.7; font-size: 16px; padding-bottom: 80px; }
        
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.02em; color: var(--text-main); }
        h1 { font-size: 2.5rem; line-height: 1.2; margin-bottom: 1rem; }
        h2 { font-size: 1.5rem; margin-top: 2.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        h3 { font-size: 1.2rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        p { margin-bottom: 1.2rem; color: var(--text-muted); max-width: 800px; }
        
        /* FOUR CORNERS UI */
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; z-index: 100; }
        .top-left { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .top-left span { background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; }
        .top-right { display: flex; gap: 1rem; align-items: center; }
        
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; z-index: 100; }
        .bottom-left { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 10px;}
        .bottom-right { display: flex; gap: 1rem; }

        /* PROGRESS RING */
        .progress-ring { width: 24px; height: 24px; border-radius: 50%; background: conic-gradient(var(--success) 0%, var(--border) 0%); }

        /* LAYOUT */
        .app-container { display: flex; margin-top: 64px; }
        .sidebar { width: 300px; background: var(--bg-subtle); border-right: 1px solid var(--border); height: calc(100vh - 134px); position: fixed; overflow-y: auto; padding: 1.5rem; }
        .main-content { margin-left: 300px; padding: 3rem 4rem; max-width: 1100px; width: 100%; min-height: calc(100vh - 134px); }

        /* BUTTONS */
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.6rem 1.2rem; font-weight: 600; font-size: 0.95rem; border-radius: 8px; cursor: pointer; transition: var(--transition); border: 1px solid transparent; font-family: inherit; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .btn-outline { background: transparent; border-color: var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-subtle); }
        
        /* CARDS & COMPONENTS */
        .card { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 1.5rem; }
        
        .tamil-note { display: flex; gap: 12px; background: #f1f5f9; border-left: 4px solid #64748b; padding: 1rem 1.2rem; border-radius: 0 var(--radius-md) var(--radius-md) 0; margin: 1.5rem 0; font-size: 0.95rem; color: #334155; }
        .tamil-note span { font-size: 1.2rem; }

        .teacher-tip { background: var(--teacher-bg); border: 1px solid var(--teacher-border); border-radius: var(--radius-md); padding: 1.5rem; margin: 2rem 0; position: relative; }
        .teacher-tip::before { content: '👨‍🏫 Teacher Note'; position: absolute; top: -12px; left: 1.5rem; background: var(--teacher-bg); padding: 0 10px; font-weight: 700; font-size: 0.85rem; color: #a16207; border: 1px solid var(--teacher-border); border-radius: 12px; }

        .interview-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; margin: 1.5rem 0; }
        .interview-q { font-weight: 600; color: var(--text-main); margin-bottom: 0.5rem; }
        .interview-a { color: var(--text-muted); font-size: 0.95rem; }

        /* VISUAL DIAGRAMS */
        .svg-container { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 2rem; display: flex; justify-content: center; margin: 2rem 0; }
        .diagram-node { fill: white; stroke: var(--accent); stroke-width: 2; rx: 8; }
        .diagram-text { font-family: var(--font-main); font-size: 14px; font-weight: 600; fill: var(--text-main); text-anchor: middle; }
        .diagram-arrow { stroke: var(--text-muted); stroke-width: 2; marker-end: url(#arrowhead); }

        /* SIMULATED CODE LAB */
        .sim-lab { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin: 2rem 0; box-shadow: var(--shadow-sm); }
        .sim-header { background: var(--bg-dark); color: white; padding: 0.75rem 1rem; font-size: 0.85rem; font-weight: 600; display: flex; justify-content: space-between; }
        .sim-body { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-subtle); }
        .sim-code { background: #1e293b; color: #f8fafc; padding: 1.5rem; font-family: 'Courier New', monospace; font-size: 0.9rem; overflow-x: auto; line-height: 1.6; }
        .sim-preview { padding: 1.5rem; background: white; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .sim-output-box { margin-top: 1rem; padding: 1rem; background: #f1f5f9; border-radius: 6px; font-family: monospace; font-size: 0.9rem; min-height: 100px; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid #cbd5e1; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* TOPIC GRID */
        .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .topic-card { padding: 1.5rem; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; transition: var(--transition); }
        .topic-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .topic-card.done { border-color: var(--success); }
        .topic-num { font-size: 2rem; font-weight: 800; color: #e2e8f0; line-height: 1; margin-bottom: 0.5rem; }
        .topic-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; }

        .nav-link { display: block; padding: 0.75rem 1rem; margin-bottom: 0.5rem; border-radius: 8px; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; cursor: pointer; }
        .nav-link:hover { background: white; color: var(--text-main); }
        .nav-link.active { background: white; color: var(--accent); font-weight: 600; border-left: 3px solid var(--accent); box-shadow: var(--shadow-sm); }

        /* INTERACTIVE EXPLANATION */
        .code-explain { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.5rem; margin: 1.5rem 0; }
        .code-pane { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.85rem; }
        .explain-pane { background: var(--bg-subtle); padding: 1rem; border-radius: 8px; font-size: 0.9rem; }
        .explain-line { margin-bottom: 0.75rem; border-bottom: 1px dashed var(--border); padding-bottom: 0.5rem; }
        
        .classroom-mode .sidebar { display: none; }
        .classroom-mode .main-content { margin-left: 0; max-width: 100%; padding: 2rem 5%; font-size: 1.1rem; }
        .classroom-mode h1 { font-size: 3rem; }

        @media (max-width: 1024px) { .sim-body { grid-template-columns: 1fr; } .sim-preview { border-left: none; border-top: 1px solid var(--border); } .code-explain { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 1.5rem; padding-bottom: 6rem; } }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">

    <div class="app-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div style="margin-bottom: 1.5rem;">
                <input type="text" placeholder="Search topics..." style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit;">
            </div>
            <div id="nav-menu"></div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content" id="main-content">

    <script>
        const syllabusData = [
            {
                id: 1,
                title: "MVC & Servlet Life Cycle",
                desc: "Understand the Model-View-Controller architecture and how a Java Servlet processes requests.",
                content: `
                    <h1>MVC & Servlet Life Cycle</h1>
                    <p>In Unit 3, we learned that HTML, CSS, and JS run in the user's browser. Now, we move to the <strong>Server-Side</strong>. When a user clicks "Login", the request goes to a server. How does the server handle it?</p>
                    
                    <h2>1. The MVC Architecture</h2>
                    <p>MVC stands for <strong>Model-View-Controller</strong>. It is a design pattern used to divide an application into three interconnected parts.</p>
                    
                    <div class="tamil-note">
                        <span>💡</span>
                        <div>
                            <strong>Tamil Understanding:</strong> ஒரு Restaurant-க்கு போறீங்க. <br>
                            Customer பார்க்கும் Menu & Table = <strong>View</strong> (UI).<br>
                            Order வாங்கும் Waiter = <strong>Controller</strong> (Servlet).<br>
                            உள்ளே சமைக்கும் Kitchen = <strong>Model</strong> (Database/Logic).
                        </div>
                    </div>

                    <div class="svg-container">
                        <svg width="400" height="250" viewBox="0 0 400 250">
                            <defs>
                                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                    <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
                                </marker>
                            </defs>
                            <!-- View -->
                            <rect x="20" y="100" width="100" height="50" class="diagram-node" />
                            <text x="70" y="130" class="diagram-text">VIEW (JSP)</text>
                            
                            <!-- Controller -->
                            <rect x="150" y="20" width="120" height="50" class="diagram-node" stroke="#f59e0b" />
                            <text x="210" y="50" class="diagram-text">CONTROLLER</text>
                            <text x="210" y="65" font-size="10" fill="#475569" text-anchor="middle">(Servlet)</text>
                            
                            <!-- Model -->
                            <rect x="280" y="100" width="100" height="50" class="diagram-node" stroke="#10b981" />
                            <text x="330" y="130" class="diagram-text">MODEL (DB)</text>

                            <!-- Arrows -->
                            <line x1="70" y1="100" x2="150" y2="45" class="diagram-arrow" />
                            <text x="90" y="65" font-size="11" fill="#475569">1. Request</text>
                            
                            <line x1="270" y1="45" x2="330" y2="100" class="diagram-arrow" />
                            <text x="310" y="65" font-size="11" fill="#475569">2. Update</text>
                            
                            <line x1="280" y1="125" x2="120" y2="125" class="diagram-arrow" />
                            <text x="200" y="115" font-size="11" fill="#475569">3. Response Data</text>
                        </svg>
                    </div>

                    <h2>2. What is a Servlet?</h2>
                    <p>A Servlet is a Java program that runs on a web server. It receives the HTTP request from the browser, processes it (e.g., checks database), and sends back an HTTP response.</p>

                    <h2>3. Servlet Life Cycle</h2>
                    <p>Just like a person goes to an office, works, and leaves, a Servlet has a life cycle:</p>
                    <ol style="margin-left: 2rem; margin-bottom: 1.5rem; color: var(--text-muted);">
                        <li><strong>init()</strong> : Called once when the servlet is created (Office opens).</li>
                        <li><strong>service()</strong> : Called for every user request like GET or POST (Employee working).</li>
                        <li><strong>destroy()</strong> : Called once when the server shuts down (Office closes).</li>
                    </ol>

                    <div class="teacher-tip">
                        <strong>Ask Students:</strong> "If 100 users try to login at the same time, how many times is init() called?" <br>
                        <strong>Answer:</strong> Only once! But the service() method is called 100 times. This makes Servlets very fast and memory-efficient.
                    </div>

                    <h2>4. Simulated Code Lab: Servlet Request</h2>
                    <p>Let's simulate how a Servlet handles a POST request from an HTML form.</p>

                    <div class="sim-lab">
                        <div class="sim-header">
                            <span>Java Servlet (Controller)</span>
                            <span>Server Output</span>
                        </div>
                        <div class="sim-body">
                            <div class="sim-code">
protected void doPost(HttpServletRequest request, 
                      HttpServletResponse response) {
    
    // 1. Get data from View (Browser)
    String user = request.getParameter("username");
    
    // 2. Set response type
    response.setContentType("text/html");
    PrintWriter out = response.getWriter();
    
    // 3. Send response back
    out.println("&lt;h1&gt;Login Successful!&lt;/h1&gt;");
    out.println("Welcome, " + user);
}
                            </div>
                            <div class="sim-preview">
                                <label style="font-size:0.85rem; font-weight:600; margin-bottom:5px;">Browser View (Form)</label>
                                <input type="text" id="sim-user-1" value="Mani" style="padding:8px; border:1px solid #cbd5e1; border-radius:4px; margin-bottom:10px;">
                                <button class="btn btn-primary" onclick="simulateServlet1()">Submit Request to Server</button>
                                
                                <div style="display:flex; align-items:center; gap:10px; margin-top:15px;">
                                    <div class="spinner" id="spinner-1"></div>
                                    <span id="sim-status-1" style="font-size:0.85rem; color:var(--text-muted);"></span>
                                </div>
                                <div class="sim-output-box" id="sim-out-1">
                                    <em>Response will appear here...</em>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="interview-box">
                        <div class="interview-q">Q: What is the difference between doGet() and doPost()?</div>
                        <div class="interview-a"><strong>doGet()</strong> is used to fetch data (parameters are visible in URL). <strong>doPost()</strong> is used to submit sensitive data like passwords (parameters are hidden in the request body).</div>
                    </div>
                `
            },
            {
                id: 2,
                title: "Session Tracking & JDBC",
                desc: "Learn how servers remember users across multiple pages and connect to databases.",
                content: `
                    <h1>Session Tracking & JDBC</h1>
                    
                    <h2>1. The Problem: HTTP is Stateless</h2>
                    <p>By default, web servers have short-term memory loss. If you login on Page 1, and navigate to Page 2, the server forgets who you are!</p>
                    
                    <div class="tamil-note">
                        <span>💡</span>
                        <div>
                            <strong>Tamil Understanding:</strong> Hotel-ல room book பண்ணிட்டு, திரும்ப reception-க்கு வந்தா, receptionist உங்களை நியாபகம் வச்சிருக்கணும். அதுக்கு பேரு தான் Session. Web-ல Session Tracking இல்லைனா, ஒவ்வொரு page-க்கும் login பண்ணனும்.
                        </div>
                    </div>

                    <h2>2. HttpSession in Java</h2>
                    <p>We use <code>HttpSession</code> to store user data across multiple requests.</p>
                    
                    <div class="code-explain">
                        <div class="code-pane">
// Create or get session
HttpSession session = request.getSession();

// Store data in session
session.setAttribute("user", "Mani");

// Retrieve data later
String name = (String) session.getAttribute("user");
                        </div>
                        <div class="explain-pane">
                            <div class="explain-line"><strong>request.getSession()</strong><br>Creates a unique space in server memory for this specific user.</div>
                            <div class="explain-line"><strong>setAttribute()</strong><br>Saves data like a key-value pair.</div>
                            <div class="explain-line"><strong>getAttribute()</strong><br>Reads the saved data on a different page.</div>
                        </div>
                    </div>

                    <h2>3. JDBC (Java Database Connectivity)</h2>
                    <p>To verify if a login is correct, the Java Servlet must talk to a Database (like MySQL or Oracle). JDBC is the API that allows this.</p>
                    
                    <div class="svg-container">
                        <svg width="450" height="100" viewBox="0 0 450 100">
                            <rect x="10" y="25" width="100" height="50" class="diagram-node" stroke="#2563eb" />
                            <text x="60" y="55" class="diagram-text">Java App</text>
                            
                            <rect x="175" y="25" width="100" height="50" class="diagram-node" stroke="#f59e0b" fill="#fefce8" />
                            <text x="225" y="55" class="diagram-text">JDBC Driver</text>
                            
                            <rect x="340" y="25" width="100" height="50" class="diagram-node" stroke="#10b981" />
                            <text x="390" y="55" class="diagram-text">Database</text>
                            
                            <line x1="110" y1="50" x2="175" y2="50" stroke="#475569" stroke-width="2" />
                            <line x1="275" y1="50" x2="340" y2="50" stroke="#475569" stroke-width="2" />
                        </svg>
                    </div>

                    <h3>Important JDBC Steps:</h3>
                    <ol style="margin-left: 2rem; color: var(--text-muted);">
                        <li>Load the Driver (<code>Class.forName(...)</code>)</li>
                        <li>Establish Connection (<code>DriverManager.getConnection(...)</code>)</li>
                        <li>Create Statement (<code>connection.prepareStatement(...)</code>)</li>
                        <li>Execute Query (<code>stmt.executeQuery()</code>)</li>
                        <li>Process ResultSet & Close</li>
                    </ol>
                `
            },
            {
                id: 3,
                title: "Hibernate & ORM",
                desc: "Simplify database operations by mapping Java Objects directly to Database Tables.",
                content: `
                    <h1>Hibernate & ORM</h1>
                    
                    <h2>1. Why Hibernate? (The JDBC Problem)</h2>
                    <p>In JDBC, you have to write raw SQL queries (<code>SELECT * FROM students</code>) and manually map the data to Java objects. If you change a column name in the database, your Java code breaks.</p>
                    
                    <h2>2. What is ORM?</h2>
                    <p><strong>Object Relational Mapping (ORM)</strong> is a technique to map Java Objects directly to Database Tables without writing complex SQL.</p>
                    
                    <div class="tamil-note">
                        <span>💡</span>
                        <div>
                            <strong>Tamil Understanding:</strong> Database-ல் 'students' னு ஒரு table இருக்கு. Java-ல் 'Student' னு ஒரு class இருக்கு. இது ரெண்டையும் connect பண்ணி, object-ஐ save பண்ணாலே table-ல் data save ஆகுற magic தான் Hibernate (ORM).
                        </div>
                    </div>

                    <div class="code-explain">
                        <div class="code-pane">
// JDBC Approach (Hard)
String sql = "INSERT INTO students (name) VALUES (?)";
PreparedStatement ps = conn.prepareStatement(sql);
ps.setString(1, student.getName());
ps.executeUpdate();

<br><br>
// Hibernate Approach (Easy)
session.save(student);
                        </div>
                        <div class="explain-pane">
                            <p>Notice how Hibernate doesn't need SQL. You simply tell it to save the <code>student</code> object, and it automatically generates the SQL behind the scenes!</p>
                        </div>
                    </div>

                    <div class="teacher-tip">
                        Tell students: Hibernate acts like a Translator. It understands Java on one side, translates it to SQL, and talks to the Database on the other side.
                    </div>
                `
            },
            {
                id: 4,
                title: "JSP (JavaServer Pages)",
                desc: "Create dynamic HTML pages on the server side using JSP tags.",
                content: `
                    <h1>JSP (JavaServer Pages)</h1>
                    <p>Servlets are great for writing Java logic, but terrible for writing HTML. Writing <code>out.println("&lt;html&gt;")</code> hundreds of times is frustrating.</p>
                    <p><strong>JSP allows you to write HTML and embed Java code inside it.</strong></p>
                    
                    <h2>1. Static vs Dynamic Pages</h2>
                    <p>Static: <code>&lt;h1&gt;Welcome User&lt;/h1&gt;</code> (Same for everyone)</p>
                    <p>Dynamic: <code>&lt;h1&gt;Welcome, &lt;%= session.getAttribute("user") %&gt;&lt;/h1&gt;</code> (Changes based on who logged in)</p>

                    <h2>2. JSP Elements</h2>
                    <ul>
                        <li><strong>Expression</strong> <code>&lt;%= ... %&gt;</code> : Prints data directly to the page.</li>
                        <li><strong>Scriptlet</strong> <code>&lt;% ... %&gt;</code> : Write multiple lines of Java logic.</li>
                        <li><strong>Declaration</strong> <code>&lt;%! ... %&gt;</code> : Declare variables or methods.</li>
                    </ul>

                    <div class="sim-lab">
                        <div class="sim-header">
                            <span>dashboard.jsp</span>
                            <span>Browser Output</span>
                        </div>
                        <div class="sim-body">
                            <div class="sim-code">
&lt;html&gt;
&lt;body&gt;
    &lt;!-- JSP Expression Tag --&gt;
    &lt;h1&gt;Welcome, &lt;%= request.getParameter("name") %&gt;!&lt;/h1&gt;
    
    &lt;p&gt;Today's date is: &lt;br&gt;
    &lt;!-- JSP Scriptlet --&gt;
    &lt;% 
        java.util.Date d = new java.util.Date();
        out.println(d.toString()); 
    %&gt;
    &lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;
                            </div>
                            <div class="sim-preview">
                                <label style="font-size:0.85rem; font-weight:600; margin-bottom:5px;">Simulate User Request</label>
                                <input type="text" id="sim-user-2" value="Manikandan" style="padding:8px; border:1px solid #cbd5e1; border-radius:4px; margin-bottom:10px;">
                                <button class="btn btn-primary" onclick="simulateJSP()">Load JSP Page</button>
                                
                                <div style="display:flex; align-items:center; gap:10px; margin-top:15px;">
                                    <div class="spinner" id="spinner-2"></div>
                                </div>
                                <div class="sim-output-box" id="sim-out-2" style="background:white; border:1px solid var(--border);">
                                    <em>Page preview will appear here...</em>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 5,
                title: "Spring & Spring Boot",
                desc: "Modern enterprise application development frameworks and build tools.",
                content: `
                    <h1>Spring & Spring Boot</h1>
                    
                    <h2>1. What is Spring?</h2>
                    <p>Building large Java web applications with raw Servlets and JDBC gets very messy. <strong>Spring</strong> is a massive framework that helps manage large enterprise applications.</p>
                    <p>Its core feature is <strong>Dependency Injection</strong>. Instead of objects creating their own dependencies (e.g., a Controller creating a Database Connection), Spring creates them and "injects" them where needed.</p>
                    
                    <h2>2. Maven & Gradle (Build Tools)</h2>
                    <p>To use Hibernate or Spring, you need their <code>.jar</code> files. Downloading them manually is painful.</p>
                    <div class="tamil-note">
                        <span>💡</span>
                        <div>
                            <strong>Tamil Understanding:</strong> Maven / Gradle என்பது ஒரு Shopping List மாதிரி. நமக்கு என்னென்ன Library (Spring, Database driver) வேணும்னு <code>pom.xml</code>-ல சொல்லிட்டா, அதுவே internet-ல இருந்து download பண்ணி project-ல add பண்ணிடும்.
                        </div>
                    </div>

                    <h2>3. Why Spring Boot?</h2>
                    <p>Configuring standard Spring is very difficult (lots of XML files). <strong>Spring Boot</strong> makes it incredibly easy by providing "auto-configuration".</p>
                    
                    <div class="card" style="background:#f8fafc; border-left: 4px solid var(--accent);">
                        <h3>The Magic of Spring Boot</h3>
                        <p>With Spring Boot, you can create a fully working web server with just a few annotations. It even has an embedded server (Tomcat) built-in!</p>
                        <pre style="background:var(--bg-dark); color:white; padding:1rem; border-radius:6px; margin-top:10px;">
@RestController
@SpringBootApplication
public class MyApp {
    
    @GetMapping("/hello")
    public String sayHello() {
        return "Hello from Spring Boot!";
    }

    public static void main(String[] args) {
        SpringApplication.run(MyApp.class, args);
    }
}</pre>
                    </div>

                    <div class="interview-box">
                        <div class="interview-q">Q: What is the main advantage of Spring Boot over standard Spring?</div>
                        <div class="interview-a">Auto-configuration. It automatically configures things like database connections based on the libraries present in the classpath, eliminating complex XML configurations.</div>
                    </div>
                `
            }
        ];

        let completed = [];
        let isClassroom = false;

        function initApp() {
            renderMenu();
            renderTopic(1);
            updateProgress();
        }

        function renderMenu() {
            const menu = document.getElementById('nav-menu');
            menu.innerHTML = `
                <div class="nav-link" onclick="renderHome()">🏠 Unit 04 Overview</div>
                <div style="height:1px; background:var(--border); margin:10px 0;"></div>
            `;
            syllabusData.forEach(topic => {
                const isDone = completed.includes(topic.id) ? '✓ ' : '';
                menu.innerHTML += `<div class="nav-link" id="nav-${topic.id}" onclick="renderTopic(${topic.id})">${isDone}${topic.id}. ${topic.title}</div>`;
            });
        }

        function renderHome() {
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            
            let gridHtml = '';
            syllabusData.forEach(t => {
                const doneClass = completed.includes(t.id) ? 'done' : '';
                const doneMark = completed.includes(t.id) ? '<span style="color:var(--success)">✓</span>' : '';
                gridHtml += `
                    <div class="topic-card ${doneClass}" onclick="renderTopic(${t.id})">
                        <div class="topic-num">0${t.id}</div>
                        <div class="topic-title">${t.title} ${doneMark}</div>
                        <p style="font-size:0.9rem; margin:0;">${t.desc}</p>
                    </div>
                `;
            });

            document.getElementById('main-content').innerHTML = `
                <span style="background:#eff6ff; color:#1d4ed8; padding:4px 10px; border-radius:6px; font-size:0.85rem; font-weight:700;">UNIT 04</span>
                <h1 style="margin-top:1rem; font-size: 3rem;">Server-Side Programming</h1>
                <p style="font-size:1.1rem; max-width:700px;">Transition from the browser to the backend. Learn how web servers process requests, maintain sessions, connect to databases using JDBC/Hibernate, and build modern enterprise applications using Spring Boot.</p>
                
                <h2 style="margin-top:3rem;">What You'll Learn</h2>
                <div class="topic-grid">
                    ${gridHtml}
                </div>
            `;
            renderFooterActions(null);
        }

        function renderTopic(id) {
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${id}`);
            if(activeNav) activeNav.classList.add('active');

            const topic = syllabusData.find(t => t.id === id);
            document.getElementById('main-content').innerHTML = `
                <span style="background:#eff6ff; color:#1d4ed8; padding:4px 10px; border-radius:6px; font-size:0.85rem; font-weight:700;">TOPIC 0${topic.id}</span>
                ${topic.content}
            `;
            window.scrollTo(0, 0);
            renderFooterActions(id);
        }

        function renderFooterActions(currentId) {
            const footer = document.getElementById('nav-actions');
            if(!currentId) {
                footer.innerHTML = `<button class="btn btn-primary" onclick="renderTopic(1)">Start Learning →</button>`;
                return;
            }

            const isDone = completed.includes(currentId);
            const nextTopic = syllabusData.find(t => t.id === currentId + 1);
            const prevTopic = syllabusData.find(t => t.id === currentId - 1);

            let html = '';
            if(prevTopic) html += `<button class="btn btn-outline" onclick="renderTopic(${prevTopic.id})">← Previous</button>`;
            
            if(isDone) {
                html += `<button class="btn btn-outline" style="border-color:var(--success); color:var(--success);">✓ Completed</button>`;
            } else {
                html += `<button class="btn btn-primary" onclick="markDone(${currentId})">Mark as Complete ✓</button>`;
            }

            if(nextTopic) {
                html += `<button class="btn btn-outline" onclick="renderTopic(${nextTopic.id})">Next Topic →</button>`;
            } else {
                html += `<button class="btn btn-primary" onclick="renderHome()">Finish Unit 🏆</button>`;
            }

            footer.innerHTML = html;
        }

        function markDone(id) {
            if(!completed.includes(id)) {
                completed.push(id);
                updateProgress();
                renderMenu();
                renderFooterActions(id);
            }
        }

        function updateProgress() {
            const pct = Math.round((completed.length / syllabusData.length) * 100);
            document.getElementById('prog-text').innerText = pct + '% Completed';
            document.getElementById('prog-ring').style.background = `conic-gradient(var(--success) ${pct}%, var(--border) 0%)`;
        }

        function toggleClassroom() {
            isClassroom = !isClassroom;
            if(isClassroom) {
                document.body.classList.add('classroom-mode');
            } else {
                document.body.classList.remove('classroom-mode');
            }
        }

        /* SIMULATION FUNCTIONS */
        function simulateServlet1() {
            const user = document.getElementById('sim-user-1').value;
            const spinner = document.getElementById('spinner-1');
            const status = document.getElementById('sim-status-1');
            const out = document.getElementById('sim-out-1');
            
            spinner.style.display = 'block';
            status.innerText = 'Sending POST request to Servlet...';
            out.innerHTML = '';
            
            setTimeout(() => {
                spinner.style.display = 'none';
                status.innerText = '200 OK (Response Received)';
                out.innerHTML = `
                    <h1 style="margin-bottom:10px; font-family:var(--font-main);">Login Successful!</h1>
                    <span style="font-family:var(--font-main); font-size:1.1rem;">Welcome, ${user}</span>
                    <br><br><br>
                    <span style="color:var(--success); font-size:0.8rem;">✓ Rendered by Browser</span>
                `;
            }, 1200);
        }

        function simulateJSP() {
            const user = document.getElementById('sim-user-2').value;
            const spinner = document.getElementById('spinner-2');
            const out = document.getElementById('sim-out-2');
            
            spinner.style.display = 'block';
            out.innerHTML = '';
            
            setTimeout(() => {
                spinner.style.display = 'none';
                const dateStr = new Date().toString();
                out.innerHTML = `
                    <h1 style="font-family:var(--font-main);">Welcome, ${user}!</h1>
                    <p style="font-family:var(--font-main);">Today's date is: <br>
                    <strong>${dateStr}</strong></p>
                `;
            }, 1000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
