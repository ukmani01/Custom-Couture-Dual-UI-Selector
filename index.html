<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Couture — Select Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .selector-container {
            max-width: 820px;
            width: 100%;
            text-align: center;
        }

        .selector-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .selector-sub {
            color: #6B7280;
            font-size: 1rem;
            margin-bottom: 3rem;
        }

        .selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .selector-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            text-align: center;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .selector-card:hover {
            border-color: #2563EB;
            box-shadow: 0 10px 25px -8px rgba(37, 99, 235, 0.15);
            transform: translateY(-4px);
        }

        .selector-card:active {
            transform: scale(0.98);
        }

        .selector-card .icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1.25rem;
            background: #EFF6FF;
            color: #2563EB;
        }

        .selector-card .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 0.5rem;
        }

        .selector-card .card-desc {
            font-size: 0.9rem;
            color: #6B7280;
            line-height: 1.5;
            max-width: 260px;
        }

        .selector-card .card-badge {
            margin-top: 1.25rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #2563EB;
            background: #EFF6FF;
            padding: 0.3rem 1rem;
            border-radius: 9999px;
            display: inline-block;
        }

        /* card variant styles */
        .selector-card.variant-2 .icon-wrap {
            background: #FEF3C7;
            color: #D97706;
        }

        .selector-card.variant-2 .card-badge {
            background: #FEF3C7;
            color: #D97706;
        }

        .selector-card.variant-2:hover {
            border-color: #D97706;
            box-shadow: 0 10px 25px -8px rgba(217, 119, 6, 0.15);
        }

        @media (max-width: 640px) {
            .selector-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .selector-title {
                font-size: 1.5rem;
            }
            .selector-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="selector-container">
        <h1 class="selector-title">Choose Your Interface</h1>
        <p class="selector-sub">Select one of the two design systems below.</p>

        <div class="selector-grid">
            <!-- UI 1 → index14.html -->
            <a href="index4.html" class="selector-card">
                <div class="icon-wrap">
                    <i class="fas fa-paint-brush"></i>
                </div>
                <div class="card-title">UI 1</div>
                <div class="card-desc">Modern clean system with builder &amp; dashboard</div>
                <span class="card-badge">index14.html</span>
            </a>

            <!-- UI 2 → index17.html (replaces index16.html) -->
            <a href="index7.html" class="selector-card variant-2">
                <div class="icon-wrap">
                    <i class="fas fa-crown"></i>
                </div>
                <div class="card-title">UI 2</div>
                <div class="card-desc">Updated luxury editorial fusion with atelier studio</div>
                <span class="card-badge">index17.html</span>
            </a>
        </div>
    </div>

</body>
</html>
