<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FLIPZONE — Daily Deals & Lightning Offers</title>
  <!-- SYSTEM_ID: LUX_002 | DESIGN_LANGUAGE: Flipkart-Style Deal Engine (Bold Banners & Flash Sales) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ---------- UNIQUE DESIGN SYSTEM: DEAL ENGINE (Bold, vibrant, flash-sale focused) ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F5F5F5;
      font-family: 'Outfit', sans-serif;
      color: #1A1A1A;
      scroll-behavior: smooth;
    }
    /* flashy scrollbar */
    ::-webkit-scrollbar { width: 6px; background: #FFE0B5; }
    ::-webkit-scrollbar-thumb { background: #FF5722; border-radius: 10px; }

    /* deal container */
    .deal-container { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem; }

    /* flash card animation */
    .flash-card {
      transition: transform 0.2s ease, box-shadow 0.2s;
      border-radius: 16px;
      overflow: hidden;
      background: white;
    }
    .flash-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.15);
    }

    /* category chips (pill style) */
    .chip-filter {
      transition: all 0.2s;
      background: #F0F0F0;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
    }
    .chip-filter.active {
      background: #FF5722;
      color: white;
    }

    /* countdown timer style */
    .deal-badge {
      background: linear-gradient(135deg, #FF5722, #FF8A50);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- ========== FLIPKART-STYLE HEADER (Deal-oriented) ========== -->
  <header class="sticky top-0 z-50 bg-white shadow-md">
    <div class="deal-container py-3 flex items-center justify-between flex-wrap gap-3">
      <div class="text-2xl font-black tracking-tighter text-orange-600">⚡ FLIPZONE</div>
      <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
        <button data-cat="all" class="chip-filter active">All Deals</button>
        <button data-cat="watches" class="chip-filter">Watches</button>
        <button data-cat="apparel" class="chip-filter">Fashion</button>
        <button data-cat="accessories" class="chip-filter">Accessories</button>
        <button data-cat="footwear" class="chip-filter">Footwear</button>
        <button data-cat="jewelry" class="chip-filter">Jewelry</button>
      </div>
      <div class="flex gap-4 items-center">
        <div class="relative">
          <input type="text" id="dealSearch" placeholder="Search products..." class="pl-4 pr-8 py-2 rounded-full bg-gray-100 border-0 text-sm w-48 focus:outline-none focus:ring-1 focus:ring-orange-500">
          <span class="absolute right-3 top-2 text-gray-500">🔍</span>
        </div>
        <button id="cartDealBtn" class="relative text-xl">🛒 <span id="cartDealCount" class="absolute -top-2 -right-3 bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span></button>
        <button id="wishDealBtn" class="text-xl">❤️</button>
      </div>
    </div>
  </header>

  <main class="deal-container py-8">
    <!-- FLASH SALE BANNER (Hero CTA) -->
    <div class="bg-gradient-to-r from-orange-600 to-red-600 rounded-2xl p-8 mb-10 text-white text-center">
      <div class="inline-block bg-white/20 backdrop-blur px-4 py-1 rounded-full text-xs font-bold mb-3">⚡ LIMITED TIME OFFER</div>
      <h1 class="text-4xl md:text-5xl font-black">MEGA DEALS WEEK</h1>
      <p class="mt-2 opacity-90">Up to 60% off + free shipping. Ends in 2 days.</p>
      <button id="dealHeroCta" class="mt-5 px-8 py-3 bg-black text-white rounded-full text-sm font-bold hover:bg-gray-800 transition">Shop Now →</button>
    </div>

    <!-- PRODUCT GRID (6+ items) -->
    <div id="dealProductGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

    <!-- NEWSLETTER CAPTURE (deal style) -->
    <div class="mt-20 bg-gray-100 rounded-2xl p-8 text-center">
      <h3 class="text-xl font-bold">Get <span class="text-orange-600">Early Access</span> to Flash Sales</h3>
      <p class="text-gray-500 text-sm mt-1">Be the first to know about exclusive deals</p>
      <form id="dealNewsForm" class="mt-5 flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
        <input type="email" id="dealNewsEmail" placeholder="Your email address" class="flex-1 px-4 py-3 rounded-full border border-gray-300" required>
        <button type="submit" class="px-6 py-3 bg-orange-600 text-white rounded-full font-semibold text-sm hover:bg-orange-700">Notify Me</button>
      </form>
      <div id="dealNewsMsg" class="text-sm mt-3 text-green-600"></div>
    </div>
  </main>

  <!-- CART DRAWER (different structure from index1) -->
  <div id="dealCartDrawer" class="fixed top-0 right-0 h-full w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-400 p-5 overflow-auto">
    <div class="flex justify-between items-center border-b pb-3"><h2 class="font-bold text-lg">My Cart</h2><button id="closeDealCart">✕</button></div>
    <div id="dealCartList" class="py-3 space-y-3"></div>
    <div class="border-t pt-3 mt-3"><div class="flex justify-between font-bold"><span>Total</span><span id="dealCartTotal">₹0</span></div><button id="dealCheckout" class="w-full mt-4 bg-orange-600 text-white py-3 rounded-full font-bold">Place Order</button></div>
  </div>
  <div id="dealCartOverlay" class="fixed inset-0 bg-black/30 z-40 hidden"></div>

  <!-- WISHLIST DRAWER -->
  <div id="dealWishDrawer" class="fixed top-0 left-0 h-full w-80 bg-black text-white z-50 transform -translate-x-full transition-transform duration-400 p-5">
    <div class="flex justify-between border-b border-white/20 pb-3"><h2 class="font-bold">Wishlist</h2><button id="closeDealWish">✕</button></div>
    <div id="dealWishList" class="mt-4 space-y-3"></div>
  </div>

  <script>
    // =====================================================
    // UNIQUE DEAL ENGINE FOR INDEX2
    // Cart Pattern: mapQuantities | Wishlist: arrayIncludes | Search: throttleRAF
    // =====================================================
    (function() {
      // PRODUCTS (8 items)
      const inventory = [
        { id: 'd1', name: 'Aether Chronograph', price: 4850, category: 'watches', material: 'Titanium', img: 'https://picsum.photos/id/20/500/600', badge: '45% OFF' },
        { id: 'd2', name: 'Noir Kimono Dress', price: 1250, category: 'apparel', material: 'Silk', img: 'https://picsum.photos/id/30/500/600', badge: 'Free Shipping' },
        { id: 'd3', name: 'Monolith Leather Tote', price: 890, category: 'accessories', material: 'Leather', img: 'https://picsum.photos/id/40/500/600', badge: 'Eco' },
        { id: 'd4', name: 'Obsidian Sunglasses', price: 450, category: 'accessories', material: 'Polarized', img: 'https://picsum.photos/id/42/500/600', badge: 'Buy 1 Get 1' },
        { id: 'd5', name: 'Echelon Loafers', price: 720, category: 'footwear', material: 'Calfskin', img: 'https://picsum.photos/id/43/500/600', badge: 'New' },
        { id: 'd6', name: 'Halo Diamond Cuff', price: 3200, category: 'jewelry', material: '18k Gold', img: 'https://picsum.photos/id/34/500/600', badge: 'Limited' },
        { id: 'd7', name: 'Cashmere Zen Sweater', price: 980, category: 'apparel', material: 'Cashmere', img: 'https://picsum.photos/id/26/500/600', badge: 'Warm Deal' },
        { id: 'd8', name: 'Void Sonic Speaker', price: 1550, category: 'electronics', material: 'Aluminum', img: 'https://picsum.photos/id/0/500/600', badge: 'Signature' }
      ];
      
      let currentDealCat = 'all';
      let dealSearchQuery = '';
      
      // ---------- CART: MapQuantities pattern ----------
      let cartMap = new Map(); // key: id, value: quantity
      function syncCartUI() {
        let total = 0, count = 0;
        let itemsArray = [];
        for (let [id, qty] of cartMap.entries()) {
          let prod = inventory.find(p => p.id === id);
          if (prod) {
            total += prod.price * qty;
            count += qty;
            itemsArray.push({ id, name: prod.name, price: prod.price, qty, img: prod.img });
          }
        }
        document.getElementById('cartDealCount').innerText = count;
        document.getElementById('dealCartTotal').innerText = '₹' + total.toLocaleString();
        const container = document.getElementById('dealCartList');
        if (itemsArray.length === 0) container.innerHTML = '<div class="text-center text-gray-500 py-6">Cart empty</div>';
        else {
          container.innerHTML = itemsArray.map(item => `
            <div class="flex justify-between items-center border-b pb-2">
              <div><span class="font-medium">${item.name}</span> x${item.qty}</div>
              <div>₹${(item.price * item.qty).toLocaleString()}</div>
              <button onclick="removeFromCartMap('${item.id}')" class="text-red-500">✕</button>
            </div>
          `).join('');
        }
      }
      window.removeFromCartMap = function(id) {
        if (cartMap.has(id)) cartMap.delete(id);
        syncCartUI();
      };
      function addToDealCart(id) {
        let prod = inventory.find(p => p.id === id);
        if (!prod) return;
        let qty = cartMap.get(id) || 0;
        cartMap.set(id, qty + 1);
        syncCartUI();
        showDealToast(`Added ${prod.name}`);
      }
      window.addToDealCart = addToDealCart;
      
      // ---------- WISHLIST: arrayIncludes pattern ----------
      let wishArray = JSON.parse(localStorage.getItem('deal_wishlist') || '[]');
      function toggleDealWish(id) {
        let idx = wishArray.indexOf(id);
        if (idx === -1) wishArray.push(id);
        else wishArray.splice(idx, 1);
        localStorage.setItem('deal_wishlist', JSON.stringify(wishArray));
        renderDealProducts();
        renderDealWishlist();
        showDealToast(idx === -1 ? 'Added to wishlist' : 'Removed');
      }
      function renderDealWishlist() {
        const container = document.getElementById('dealWishList');
        let wishProds = inventory.filter(p => wishArray.includes(p.id));
        if (wishProds.length === 0) { container.innerHTML = '<div class="text-gray-400 text-center">No items</div>'; return; }
        container.innerHTML = wishProds.map(p => `
          <div class="flex gap-3 border-b border-white/20 pb-2">
            <img src="${p.img}" class="w-14 h-16 object-cover">
            <div><div class="font-medium">${p.name}</div><div>₹${p.price}</div><button onclick="toggleDealWish('${p.id}')" class="text-orange-400 text-xs mt-1">Remove</button></div>
          </div>
        `).join('');
      }
      
      // ---------- PRODUCT RENDERING + FILTER + SEARCH ----------
      function renderDealProducts() {
        let filtered = inventory.filter(p => currentDealCat === 'all' || p.category === currentDealCat);
        if (dealSearchQuery.trim() !== '') {
          filtered = filtered.filter(p => p.name.toLowerCase().includes(dealSearchQuery.toLowerCase()) || p.material.toLowerCase().includes(dealSearchQuery.toLowerCase()));
        }
        const grid = document.getElementById('dealProductGrid');
        grid.innerHTML = filtered.map(p => {
          let inWish = wishArray.includes(p.id);
          return `
            <div class="flash-card bg-white border border-gray-200">
              <div class="relative">
                <img src="${p.img}" class="w-full aspect-[3/4] object-cover">
                ${p.badge ? `<div class="absolute top-2 left-2 deal-badge px-2 py-1 rounded text-[10px] font-bold">${p.badge}</div>` : ''}
                <button onclick="toggleDealWish('${p.id}')" class="absolute top-2 right-2 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md">${inWish ? '❤️' : '🤍'}</button>
                <div class="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black/60 to-transparent translate-y-full group-hover:translate-y-0 transition-all duration-300" style="transform: translateY(100%);" onmouseenter="this.style.transform='translateY(0)'" onmouseleave="this.style.transform='translateY(100%)'">
                  <button onclick="addToDealCart('${p.id}')" class="w-full bg-white text-black py-2 rounded-full text-xs font-bold">ADD TO CART</button>
                </div>
              </div>
              <div class="p-3">
                <div class="font-semibold">${p.name}</div>
                <div class="text-xs text-gray-500">${p.material}</div>
                <div class="mt-1 font-bold text-orange-600">₹${p.price.toLocaleString()}</div>
              </div>
            </div>
          `;
        }).join('');
      }
      
      function changeDealCategory(cat, btn) {
        currentDealCat = cat;
        document.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderDealProducts();
      }
      
      // ---------- SEARCH: throttleRAF pattern ----------
      let rafDealId = null;
      const searchDealInput = document.getElementById('dealSearch');
      searchDealInput.addEventListener('input', (e) => {
        if (rafDealId) cancelAnimationFrame(rafDealId);
        rafDealId = requestAnimationFrame(() => {
          dealSearchQuery = e.target.value;
          renderDealProducts();
          rafDealId = null;
        });
      });
      
      // ---------- NEWSLETTER ----------
      document.getElementById('dealNewsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        let email = document.getElementById('dealNewsEmail').value;
        if (email && email.includes('@')) {
          let subs = JSON.parse(localStorage.getItem('deal_newsletter') || '[]');
          if (!subs.includes(email)) subs.push(email);
          localStorage.setItem('deal_newsletter', JSON.stringify(subs));
          document.getElementById('dealNewsMsg').innerHTML = '✓ You are on the list!';
          document.getElementById('dealNewsEmail').value = '';
        } else alert('Enter valid email');
      });
      
      // ---------- UI HELPERS ----------
      function showDealToast(msg) {
        let t = document.createElement('div');
        t.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-black text-white px-5 py-2 rounded-full text-sm z-[9999]';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
      }
      
      // Bind category buttons
      document.querySelectorAll('.chip-filter').forEach(btn => {
        btn.addEventListener('click', () => changeDealCategory(btn.getAttribute('data-cat'), btn));
      });
      // Cart drawer events
      document.getElementById('cartDealBtn').onclick = () => { document.getElementById('dealCartDrawer').classList.remove('translate-x-full'); document.getElementById('dealCartOverlay').classList.remove('hidden'); };
      document.getElementById('closeDealCart').onclick = () => { document.getElementById('dealCartDrawer').classList.add('translate-x-full'); document.getElementById('dealCartOverlay').classList.add('hidden'); };
      document.getElementById('dealCartOverlay').onclick = () => { document.getElementById('dealCartDrawer').classList.add('translate-x-full'); document.getElementById('dealCartOverlay').classList.add('hidden'); };
      document.getElementById('wishDealBtn').onclick = () => { document.getElementById('dealWishDrawer').classList.remove('-translate-x-full'); };
      document.getElementById('closeDealWish').onclick = () => { document.getElementById('dealWishDrawer').classList.add('-translate-x-full'); };
      document.getElementById('dealHeroCta').onclick = () => document.getElementById('dealProductGrid').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('dealCheckout').onclick = () => alert('Order placed! Total: ' + document.getElementById('dealCartTotal').innerText);
      
      // Initial render
      renderDealProducts();
      syncCartUI();
      renderDealWishlist();
    })();
  </script>
