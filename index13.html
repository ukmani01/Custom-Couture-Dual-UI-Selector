<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiTenant — Scroll Storytelling</title>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #0a0a1a;
  background: #ffffff;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }
ul { list-style: none; }
button { font-family: inherit; cursor: pointer; }

.container {
  max-width: 1216px;
  margin: 0 auto;
  padding: 0 32px;
}

.section-title {
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #0a0a1a;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  font-weight: 600;
  padding: 11px 20px;
  border-radius: 8px;
  transition: all .25s ease;
  border: none;
  cursor: pointer;
}
.btn:hover { opacity: .88; transform: translateY(-1px); }
.arrow { font-size: 16px; line-height: 1; transition: transform .25s ease; }
.btn:hover .arrow { transform: translateX(3px); }

.btn-outline {
  border: 1px solid #d8dae0;
  color: #4b3ee0;
  background: transparent;
}
.btn-outline:hover { background: #f0eeff; border-color: #4b3ee0; }

.btn-whatsapp {
  background: #25D366;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(37, 211, 102, .3);
}
.btn-whatsapp:hover { box-shadow: 0 6px 20px rgba(37, 211, 102, .4); }

/* ============================================================
   FEATURED STORIES — STRIPE-LIKE SCROLL
   ============================================================ */
.featured-stories {
  padding: 80px 0 120px;
  background: #fafafc;
  position: relative;
}

.stories-header {
  text-align: center;
  margin-bottom: 60px;
}
.stories-eyebrow {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  color: #5a45e8;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: #f0eeff;
  padding: 6px 18px;
  border-radius: 20px;
  margin-bottom: 16px;
}
.stories-header .section-title {
  margin-bottom: 12px;
}
.stories-sub {
  font-size: 17px;
  color: #6b6b7a;
  max-width: 520px;
  margin: 0 auto;
}

/* ============================================================
   SCROLL CONTAINER — CSS GRID
   ============================================================ */
.stories-scroll-container {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 60px;
  align-items: start;
  position: relative;
}

/* ============================================================
   STICKY PREVIEW — PINNED CARD
   ============================================================ */
.sticky-story-container {
  position: sticky;
  top: 100px;
  height: 560px;
  overflow: hidden;
  border-radius: 20px;
  background: #ffffff;
  box-shadow: 0 20px 60px rgba(0,0,0,.08);
  border: 1px solid #eceef2;
  transition: box-shadow 0.4s ease;
}

.sticky-story-container:hover {
  box-shadow: 0 30px 80px rgba(88, 65, 216, .12);
}

.story-preview {
  width: 100%;
  height: 100%;
  padding: 40px 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Subtle gradient overlay for depth */
.story-preview::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 100%);
  pointer-events: none;
  z-index: 0;
}

.story-preview > * {
  position: relative;
  z-index: 1;
}

/* Preview Image */
.preview-image-wrap {
  width: 100%;
  height: 180px;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
  background: #f4f4f8;
  position: relative;
}

.preview-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.sticky-story-container:hover .preview-image-wrap img {
  transform: scale(1.02);
}

/* Badge */
.preview-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #5a45e8;
  background: #f0eeff;
  padding: 4px 14px;
  border-radius: 12px;
  margin-bottom: 16px;
  align-self: flex-start;
  transition: all 0.3s ease;
}

/* Title */
.preview-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  line-height: 1.2;
}

/* Description */
.preview-desc {
  font-size: 15px;
  color: #6b6b7a;
  line-height: 1.6;
  margin-bottom: 16px;
  max-width: 90%;
}

/* Features */
.preview-features {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}
.preview-features span {
  background: #f4f4f8;
  padding: 3px 14px;
  border-radius: 12px;
  font-size: 12px;
  color: #555;
  font-weight: 500;
  transition: all 0.3s ease;
}
.preview-features span:hover {
  background: #e8e6ff;
  color: #5a45e8;
}

/* Price */
.preview-price {
  font-size: 24px;
  font-weight: 700;
  color: #5a45e8;
  margin-bottom: 18px;
}
.preview-price span {
  font-size: 15px;
  font-weight: 400;
  color: #6b6b7a;
}

/* Actions */
.preview-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ============================================================
   TIMELINE — SCROLL TRIGGERS
   ============================================================ */
.story-timeline {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 20px;
}

.story-trigger {
  padding: 18px 24px;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  border: 1px solid transparent;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 18px;
  position: relative;
}

/* Progress line on the left */
.story-trigger::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 3px;
  height: 0;
  background: linear-gradient(180deg, #5a45e8, #8a75ff);
  border-radius: 2px;
  transform: translateY(-50%);
  transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.story-trigger.active::before {
  height: 60%;
}

.story-trigger:hover {
  background: #f4f4f8;
  border-color: #eceef2;
}

.story-trigger.active {
  background: #ffffff;
  border-color: #5a45e8;
  box-shadow: 0 8px 30px rgba(88, 65, 216, .1);
  transform: translateX(8px);
}

.story-trigger-number {
  font-size: 13px;
  font-weight: 700;
  color: #b0b0c0;
  font-variant-numeric: tabular-nums;
  min-width: 32px;
  transition: color 0.4s ease;
}
.story-trigger.active .story-trigger-number {
  color: #5a45e8;
}

.story-trigger-content h4 {
  font-size: 16px;
  font-weight: 600;
  transition: color 0.4s ease;
}
.story-trigger.active .story-trigger-content h4 {
  color: #5a45e8;
}
.story-trigger-content p {
  font-size: 13px;
  color: #8a8a99;
  margin-top: 2px;
}

/* ============================================================
   ANIMATION CLASSES — STRIPE-LIKE TRANSITIONS
   ============================================================ */
@keyframes fadeSlideUp {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes fadeSlideDown {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-30px) scale(0.94);
  }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Exit animation */
.preview-exit {
  animation: fadeSlideDown 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* Enter animation */
.preview-enter {
  animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* Staggered child animations */
.stagger-enter .preview-badge {
  animation: fadeIn 0.5s 0.05s forwards;
  opacity: 0;
}
.stagger-enter .preview-image-wrap {
  animation: scaleIn 0.6s 0.15s forwards;
  opacity: 0;
}
.stagger-enter .preview-title {
  animation: fadeIn 0.5s 0.25s forwards;
  opacity: 0;
}
.stagger-enter .preview-desc {
  animation: fadeIn 0.5s 0.35s forwards;
  opacity: 0;
}
.stagger-enter .preview-features {
  animation: fadeIn 0.5s 0.45s forwards;
  opacity: 0;
}
.stagger-enter .preview-price {
  animation: fadeIn 0.5s 0.55s forwards;
  opacity: 0;
}
.stagger-enter .preview-actions {
  animation: fadeIn 0.5s 0.65s forwards;
  opacity: 0;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1024px) {
  .stories-scroll-container {
    grid-template-columns: 1fr;
    gap: 40px;
  }

  .sticky-story-container {
    position: relative;
    top: 0;
    height: auto;
    min-height: 420px;
    width: 100%;
  }

  .story-preview {
    padding: 32px 36px;
  }
  .preview-image-wrap {
    height: 140px;
  }

  .story-timeline {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    padding-top: 0;
  }
  .story-trigger {
    flex: 1;
    min-width: 200px;
    max-width: 280px;
    padding: 14px 20px;
  }
  .story-trigger.active {
    transform: translateX(0);
  }
  .story-trigger::before {
    display: none;
  }
}

@media (max-width: 680px) {
  .featured-stories { padding: 48px 0 64px; }
  .stories-header { margin-bottom: 32px; }
  .stories-header .section-title { font-size: 26px; }
  .stories-sub { font-size: 15px; }

  .story-preview {
    padding: 24px 20px;
    min-height: 380px;
  }
  .preview-image-wrap {
    height: 100px;
  }
  .preview-title {
    font-size: 22px;
  }
  .preview-desc {
    font-size: 14px;
    max-width: 100%;
  }
  .preview-price {
    font-size: 20px;
  }
  .preview-actions {
    flex-direction: column;
    width: 100%;
  }
  .preview-actions .btn {
    width: 100%;
    justify-content: center;
  }

  .story-timeline {
    flex-direction: column;
    gap: 4px;
  }
  .story-trigger {
    min-width: 100%;
    max-width: 100%;
    padding: 12px 16px;
  }
  .story-trigger.active {
    transform: translateX(0);
  }
  .story-trigger-number {
    min-width: 24px;
    font-size: 11px;
  }
  .story-trigger-content h4 {
    font-size: 14px;
  }
  .story-trigger::before {
    display: none;
  }

  .sticky-story-container {
    min-height: 320px;
  }
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .story-preview {
    transition: none !important;
  }
  .story-trigger {
    transition: none !important;
  }
  .preview-exit,
  .preview-enter {
    animation: none !important;
  }
  .stagger-enter .preview-badge,
  .stagger-enter .preview-image-wrap,
  .stagger-enter .preview-title,
  .stagger-enter .preview-desc,
  .stagger-enter .preview-features,
  .stagger-enter .preview-price,
  .stagger-enter .preview-actions {
    opacity: 1 !important;
    transform: none !important;
    animation: none !important;
  }
  .preview-image-wrap img {
    transform: none !important;
  }
}
</style>
</head>
<body>

<!-- ============================================================
   FEATURED STORIES — STRIPE-LIKE SCROLL
   ============================================================ -->
<section class="featured-stories" id="stories">
  <div class="container">
    <div class="stories-header">
      <span class="stories-eyebrow">✦ Featured Products</span>
      <h2 class="section-title">Premium Commerce <br>Solutions</h2>
      <p class="stories-sub">Scroll to explore our complete suite of e-commerce products and themes.</p>
    </div>

    <div class="stories-scroll-container">
      <!-- Sticky Story Container -->
      <div class="sticky-story-container">
        <div class="story-preview" id="storyPreview">
          <!-- Dynamic content inserted by JavaScript -->
        </div>
      </div>

      <!-- Scroll Timeline -->
      <div class="story-timeline" id="storyTimeline">
        <!-- Story triggers generated by JavaScript -->
      </div>
    </div>
  </div>
</section>

<script>
// ============================================================
// DATA
// ============================================================
const stories = [
  {
    id: 0,
    title: 'MAARA Luxury Indian Wear',
    badge: '✨ Premium Theme',
    description: 'High-end fashion storefront with cart, wishlist, checkout, and order simulation. Premium UI/UX experience built for luxury fashion brands.',
    image: 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&h=500&fit=crop',
    features: ['Cart', 'Wishlist', 'Checkout', 'Order Simulation'],
    price: '₹7,000',
    priceLabel: 'one-time',
    previewUrl: 'https://maara-luxury-indian-wear-demo-cart.vercel.app/',
    whatsappMsg: 'Hello%2C%20I%20am%20interested%20in%20purchasing%20MAARA%20Luxury%20Indian%20Wear%20theme%20for%20₹7000.%20Please%20share%20payment%20details.'
  },
  {
    id: 1,
    title: 'Custom Couture Dual UI',
    badge: '🎨 Design Studio',
    description: 'Dual UI experience for fashion design studios. Combines clean business workflows with luxury atelier presentation.',
    image: 'https://images.unsplash.com/photo-1497366216548-37526070297c?w=800&h=500&fit=crop',
    features: ['Dual UI', 'Clean Builder', 'Luxury Atelier', 'Workflow'],
    price: '₹5,000',
    priceLabel: 'one-time',
    previewUrl: 'https://custom-couture-dual-ui-selector.vercel.app/index8.html',
    whatsappMsg: 'Hello%2C%20I%20am%20interested%20in%20purchasing%20Custom%20Couture%20Dual%20UI%20theme%20for%20₹5000.%20Please%20share%20payment%20details.'
  },
  {
    id: 2,
    title: 'Premium E-Commerce',
    badge: '🔥 Production Ready',
    description: 'Production-ready fashion/lifestyle store with Cloudinary integration, cart, orders, and admin dashboard. Includes 20-day free trial.',
    image: 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=800&h=500&fit=crop',
    features: ['Cloudinary', 'Cart', 'Orders', 'Admin Dashboard', '20-day Trial'],
    price: '₹5,000',
    priceLabel: 'one-time',
    previewUrl: 'https://premium-ecommerce-six.vercel.app/',
    whatsappMsg: 'Hello%2C%20I%20am%20interested%20in%20purchasing%20Premium%20E-Commerce%20theme%20for%20₹5000.%20Please%20share%20payment%20details.'
  },
  {
    id: 3,
    title: 'MERN E-Commerce App',
    badge: '⚛️ Full Stack',
    description: 'Complete full-stack e-commerce platform with JWT authentication, product filters, cart, checkout, admin panel, and REST API.',
    image: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&h=500&fit=crop',
    features: ['JWT Auth', 'Product Filters', 'Cart', 'Checkout', 'Admin Panel', 'REST API'],
    price: '₹25,000',
    priceLabel: 'whole app',
    previewUrl: 'https://ecommerce-app-rho-three-69.vercel.app/',
    whatsappMsg: 'Hello%2C%20I%20am%20interested%20in%20the%20MERN%20E-Commerce%20App.%20Please%20share%20pricing%20details%20for%20the%20whole%20app%20(%E2%82%B925%2C000)%20and%20other%20options.'
  },
  {
    id: 4,
    title: 'Premium E-Commerce SaaS',
    badge: '🚀 SaaS Platform',
    description: 'Production-ready commerce SaaS platform with Cloudinary, cart & orders, admin dashboard, subscription system, and 20-day trial.',
    image: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=800&h=500&fit=crop',
    features: ['Cloudinary', 'Cart & Orders', 'Admin Dashboard', 'Subscription', '20-day Trial'],
    price: '₹15,000',
    priceLabel: 'whole app',
    previewUrl: 'https://premium-ecommerce-six.vercel.app/',
    whatsappMsg: 'Hello%2C%20I%20am%20interested%20in%20the%20Premium%20E-Commerce%20SaaS%20(%E2%82%B9300%2Fmonth%20or%20%E2%82%B915%2C000%20one-time).%20Please%20share%20more%20details.'
  }
];

// ============================================================
// DOM REFS
// ============================================================
const previewEl = document.getElementById('storyPreview');
const timelineEl = document.getElementById('storyTimeline');
let activeIndex = 0;
let isTransitioning = false;

// ============================================================
// RENDER TIMELINE
// ============================================================
function renderTimeline() {
  timelineEl.innerHTML = stories.map((story, index) => `
    <div class="story-trigger ${index === 0 ? 'active' : ''}" data-story="${index}">
      <span class="story-trigger-number">${String(index + 1).padStart(2, '0')}</span>
      <div class="story-trigger-content">
        <h4>${story.title}</h4>
        <p>${story.badge}</p>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.story-trigger').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.story);
      if (idx !== activeIndex && !isTransitioning) {
        setActiveStory(idx);
      }
    });
  });
}

// ============================================================
// RENDER PREVIEW — with stagger class
// ============================================================
function renderPreview(story, isEntering = true) {
  const html = `
    <span class="preview-badge">${story.badge}</span>
    <div class="preview-image-wrap">
      <img src="${story.image}" alt="${story.title}" loading="lazy">
    </div>
    <h3 class="preview-title">${story.title}</h3>
    <p class="preview-desc">${story.description}</p>
    <div class="preview-features">
      ${story.features.map(f => `<span>${f}</span>`).join('')}
    </div>
    <div class="preview-price">${story.price} <span>${story.priceLabel}</span></div>
    <div class="preview-actions">
      <a href="${story.previewUrl}" target="_blank" class="btn btn-outline">
        Preview <span class="arrow">&rsaquo;</span>
      </a>
      <a href="https://wa.me/916379705593?text=${story.whatsappMsg}" target="_blank" class="btn btn-whatsapp">
        💬 Buy Now <span class="arrow">&rsaquo;</span>
      </a>
    </div>
  `;

  previewEl.innerHTML = html;

  if (isEntering) {
    // Add stagger class for sequential animations
    previewEl.classList.add('stagger-enter');
    // Remove class after animation completes
    setTimeout(() => {
      previewEl.classList.remove('stagger-enter');
    }, 800);
  }
}

// ============================================================
// SET ACTIVE STORY — STRIPE-LIKE MERGE TRANSITION
// ============================================================
function setActiveStory(index, fromScroll = false) {
  if (isTransitioning || index === activeIndex) return;
  isTransitioning = true;

  // Update timeline
  document.querySelectorAll('.story-trigger').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  // Exit: current card slides down
  previewEl.classList.add('preview-exit');

  setTimeout(() => {
    // Remove exit class and render new content
    previewEl.classList.remove('preview-exit');
    renderPreview(stories[index], true);
    // Enter: new card slides up and merges
    previewEl.classList.add('preview-enter');

    setTimeout(() => {
      previewEl.classList.remove('preview-enter');
      activeIndex = index;
      isTransitioning = false;

      if (!fromScroll) {
        const trigger = document.querySelector(`.story-trigger[data-story="${index}"]`);
        if (trigger) {
          trigger.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }, 700);
  }, 600);
}

// ============================================================
// INTERSECTION OBSERVER — SCROLL TRIGGER
// ============================================================
function setupScrollTrigger() {
  const triggers = document.querySelectorAll('.story-trigger');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = parseInt(entry.target.dataset.story);
        if (idx !== activeIndex && !isTransitioning) {
          setActiveStory(idx, true);
        }
      }
    });
  }, {
    root: null,
    rootMargin: '-20% 0px -30% 0px',
    threshold: 0.3
  });

  triggers.forEach(el => observer.observe(el));
  return observer;
}

// ============================================================
// SCROLL PROGRESS TRACKING
// ============================================================
function setupProgressTracking() {
  const triggers = document.querySelectorAll('.story-trigger');
  let ticking = false;

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(() => {
        let maxRatio = 0;
        let bestIdx = 0;
        triggers.forEach((el, i) => {
          const rect = el.getBoundingClientRect();
          const windowHeight = window.innerHeight;
          const visible = Math.min(rect.bottom, windowHeight) - Math.max(rect.top, 0);
          const ratio = visible / rect.height;
          if (ratio > maxRatio) {
            maxRatio = ratio;
            bestIdx = i;
          }
        });
        if (bestIdx !== activeIndex && maxRatio > 0.2 && !isTransitioning) {
          setActiveStory(bestIdx, true);
        }
        ticking = false;
      });
      ticking = true;
    }
  });
}

// ============================================================
// INIT
// ============================================================
function init() {
  renderTimeline();
  renderPreview(stories[0], true);
  setupScrollTrigger();
  setupProgressTracking();

  // Reduced motion
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (prefersReducedMotion.matches) {
    document.querySelectorAll('.preview-badge, .preview-image-wrap, .preview-title, .preview-desc, .preview-features, .preview-price, .preview-actions')
      .forEach(el => {
        el.style.opacity = '1';
        el.style.transform = 'none';
        el.style.animation = 'none';
      });
  }
}

// Run on DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

console.log('🚀 Stripe-like scroll storytelling initialized!');
</script>
