<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEXUS — Real‑time 3D Commerce Engine</title>
  <!-- SYSTEM_ID: LUX_3D_002 | ENGINE_VERSION: GAME_ENGINE_V1.0 -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    /* floating UI overlay (glass panel) – non‑intrusive */
    .engine-ui {
      position: fixed;
      z-index: 20;
      background: rgba(8, 8, 12, 0.65);
      backdrop-filter: blur(16px);
      border-radius: 60px;
      padding: 0.6rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f0ede8;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      pointer-events: auto;
    }
    #top-panel {
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      padding: 0.6rem 1.5rem;
      z-index: 30;
    }
    .engine-logo {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      background: linear-gradient(130deg, #fff, #c6a43f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .category-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cat-engine {
      background: rgba(255,255,255,0.08);
      border: none;
      padding: 5px 14px;
      border-radius: 40px;
      color: #ddd;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-engine.active {
      background: #c6a43f;
      color: #0a0a0a;
    }
    .engine-actions {
      display: flex;
      gap: 18px;
    }
    .action-engine {
      cursor: pointer;
      position: relative;
      font-size: 1.2rem;
      transition: transform 0.2s;
    }
    .action-engine:hover { transform: scale(1.05); }
    .badge-engine {
      position: absolute;
      top: -8px;
      right: -12px;
      background: #c6a43f;
      color: black;
      font-size: 0.6rem;
      font-weight: bold;
      border-radius: 30px;
      padding: 0px 6px;
      min-width: 18px;
      text-align: center;
    }
    .search-engine input {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 40px;
      color: white;
      font-size: 0.7rem;
      width: 150px;
    }
    .search-engine input::placeholder { color: #aaa; }
    /* drawers (cart & wishlist) */
    .engine-drawer {
      position: fixed;
      top: 0;
      right: -380px;
      width: 360px;
      height: 100%;
      background: #0a0a0f;
      backdrop-filter: blur(24px);
      z-index: 100;
      transition: right 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      padding: 1.5rem;
      color: white;
      border-left: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto;
    }
    .engine-drawer.open { right: 0; }
    .close-drawer { float: right; cursor: pointer; font-size: 1.2rem; }
    .engine-drawer h3 { margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
    .cart-item, .wish-item { display: flex; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid #222; padding-bottom: 12px; }
    .cart-item img, .wish-item img { width: 60px; height: 80px; object-fit: cover; border-radius: 8px; }
    .engine-btn { background: #c6a43f; border: none; padding: 6px 12px; border-radius: 30px; cursor: pointer; font-weight: 500; }
    .engine-btn-small { background: #333; }
    .instruction {
      position: fixed;
      bottom: 18px;
      left: 18px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      color: #ccc;
      pointer-events: none;
      z-index: 15;
    }
    @media (max-width: 680px) {
      .category-pills { display: none; }
      .engine-drawer { width: 100%; right: -100%; }
      .search-engine input { width: 110px; }
    }
    /* particle animation for add-to-cart feedback */
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -60px); }
    }
  </style>
</head>
<body>
  <div id="top-panel" class="engine-ui">
    <div class="engine-logo">◈ NEXUS ◈</div>
    <div class="category-pills" id="engineCategories">
      <button data-cat="all" class="cat-engine active">All</button>
      <button data-cat="watches" class="cat-engine">Watches</button>
      <button data-cat="apparel" class="cat-engine">Apparel</button>
      <button data-cat="accessories" class="cat-engine">Objets</button>
      <button data-cat="footwear" class="cat-engine">Footwear</button>
      <button data-cat="electronics" class="cat-engine">Audio</button>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="search-engine"><input type="text" id="engineSearch" placeholder="Search spatial..."></div>
      <div class="engine-actions">
        <div class="action-engine" id="engineCartBtn">🛒<span id="cartEngineBadge" class="badge-engine">0</span></div>
        <div class="action-engine" id="engineWishBtn">❤️<span id="wishEngineBadge" class="badge-engine">0</span></div>
      </div>
    </div>
  </div>

  <!-- Cart Drawer (Engine UI) -->
  <div id="engineCartDrawer" class="engine-drawer">
    <span class="close-drawer" id="closeCartEngine">✕</span>
    <h3>Cart · engine state</h3>
    <div id="engineCartList"></div>
    <div id="engineCartTotal" style="margin-top: 1rem; font-weight: bold;">Total: $0</div>
    <button id="engineCheckoutBtn" class="engine-btn" style="width:100%; margin-top: 1rem;">Checkout →</button>
  </div>
  <!-- Wishlist Drawer -->
  <div id="engineWishDrawer" class="engine-drawer">
    <span class="close-drawer" id="closeWishEngine">✕</span>
    <h3>Wishlist · saved objects</h3>
    <div id="engineWishList"></div>
  </div>

  <div class="instruction">🖱️ Drag to rotate world | Scroll = camera zoom | Click product → cinematic focus</div>

  <!-- IMPORT Three.js Core -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // =========================================================================
    // ENGINE LAYER 1: SCENE ENGINE
    // =========================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030318);
    scene.fog = new THREE.FogExp2(0x030318, 0.01);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(6, 3.2, 9);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    // ----- ENGINE CONTROLS (Orbit + scroll inertia) -----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.5;
    controls.target.set(0, 0.6, 0);

    // =========================================================================
    // ENGINE LAYER 2: LIGHTING SYSTEM (cinematic)
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    keyLight.position.set(3, 5, 2);
    keyLight.castShadow = true;
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x5588aa, 0.45);
    fillLight.position.set(-2, 1.5, 3);
    scene.add(fillLight);
    const rimLight = new THREE.PointLight(0xffaa77, 0.6);
    rimLight.position.set(1, 2.2, -3.5);
    scene.add(rimLight);
    const backRim = new THREE.PointLight(0xccaa88, 0.4);
    backRim.position.set(-1, 1.8, -4);
    scene.add(backRim);

    // floating particles (spatial dust)
    const particleCount = 1200;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      particlePositions[i*3] = (Math.random() - 0.5) * 45;
      particlePositions[i*3+1] = (Math.random() - 0.5) * 18;
      particlePositions[i*3+2] = (Math.random() - 0.5) * 30 - 10;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.045, transparent: true, opacity: 0.35 });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);
    
    // decorative floor reflection (invisible plane)
    const shadowCatcher = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 18),
      new THREE.ShadowMaterial({ opacity: 0.35, color: 0x000000, transparent: true, side: THREE.DoubleSide })
    );
    shadowCatcher.rotation.x = -Math.PI / 2;
    shadowCatcher.position.y = -1.1;
    shadowCatcher.receiveShadow = true;
    scene.add(shadowCatcher);
    
    // central abstract sculpture (engine heart)
    const coreGeo = new THREE.IcosahedronGeometry(0.7, 0);
    const coreMat = new THREE.MeshStandardMaterial({ color: 0xc6a43f, emissive: 0x331c00, roughness: 0.2, metalness: 0.85 });
    const coreObject = new THREE.Mesh(coreGeo, coreMat);
    coreObject.position.set(0, -0.4, 0);
    coreObject.castShadow = true;
    scene.add(coreObject);

    // =========================================================================
    // ENGINE LAYER 3: OBJECT REGISTRY SYSTEM (Product entities)
    // =========================================================================
    const productsData = [
      { id: '3d_1', name: 'Aether Chronograph', price: 4850, category: 'watches', img: 'https://picsum.photos/id/20/512/512', color: 0xaa8866, posAngle: 0, radius: 4.2, yOffset: 0.2 },
      { id: '3d_2', name: 'Noir Kimono Dress', price: 1250, category: 'apparel', img: 'https://picsum.photos/id/30/512/512', color: 0x664455, posAngle: 0.5, radius: 4.0, yOffset: -0.1 },
      { id: '3d_3', name: 'Monolith Tote', price: 890, category: 'accessories', img: 'https://picsum.photos/id/40/512/512', color: 0x886655, posAngle: 1.1, radius: 4.3, yOffset: 0.4 },
      { id: '3d_4', name: 'Obsidian Shades', price: 450, category: 'accessories', img: 'https://picsum.photos/id/42/512/512', color: 0x222222, posAngle: 1.7, radius: 3.9, yOffset: 0.0 },
      { id: '3d_5', name: 'Echelon Loafers', price: 720, category: 'footwear', img: 'https://picsum.photos/id/43/512/512', color: 0xaa7744, posAngle: 2.3, radius: 4.4, yOffset: 0.1 },
      { id: '3d_6', name: 'Halo Diamond Cuff', price: 3200, category: 'accessories', img: 'https://picsum.photos/id/34/512/512', color: 0xffaa88, posAngle: 2.9, radius: 4.1, yOffset: -0.2 },
      { id: '3d_7', name: 'Cashmere Sweater', price: 980, category: 'apparel', img: 'https://picsum.photos/id/26/512/512', color: 0xccaa99, posAngle: 3.5, radius: 4.5, yOffset: 0.3 },
      { id: '3d_8', name: 'Void Speaker', price: 1550, category: 'electronics', img: 'https://picsum.photos/id/0/512/512', color: 0x88aacc, posAngle: 4.1, radius: 4.0, yOffset: -0.15 }
    ];
    
    // product mesh registry
    let productEntities = []; // each: { mesh, label, data, baseScale, hoverTween }
    let productMap = new Map(); // id -> entity
    
    function buildWorldFromRegistry(filterCat = 'all', searchTerm = '') {
      // remove existing
      productEntities.forEach(ent => {
        scene.remove(ent.mesh);
        if (ent.label) scene.remove(ent.label);
      });
      productEntities = [];
      productMap.clear();
      
      let filtered = productsData.filter(p => filterCat === 'all' || p.category === filterCat);
      if (searchTerm.trim()) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));
      }
      const count = filtered.length;
      const stepAngle = (Math.PI * 2) / Math.max(count, 1);
      filtered.forEach((prod, idx) => {
        const angle = idx * stepAngle;
        const radiusVal = prod.radius || 4.2;
        const x = Math.cos(angle) * radiusVal;
        const z = Math.sin(angle) * radiusVal;
        const y = prod.yOffset + 0.2;
        
        // create plane texture material
        const texture = new THREE.TextureLoader().load(prod.img);
        texture.colorSpace = THREE.SRGBColorSpace;
        const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.25, metalness: 0.1 });
        const planeGeo = new THREE.PlaneGeometry(1.55, 1.95);
        const mesh = new THREE.Mesh(planeGeo, material);
        mesh.position.set(x, y, z);
        mesh.userData = { productId: prod.id, isProduct: true, originalPos: new THREE.Vector3(x, y, z) };
        mesh.castShadow = true;
        mesh.receiveShadow = false;
        scene.add(mesh);
        
        // CSS2D label
        const div = document.createElement('div');
        div.textContent = `${prod.name}\n$${prod.price}`;
        div.style.backgroundColor = 'rgba(0,0,0,0.7)';
        div.style.color = '#f0e2c5';
        div.style.padding = '4px 12px';
        div.style.borderRadius = '24px';
        div.style.fontSize = '11px';
        div.style.fontWeight = '500';
        div.style.backdropFilter = 'blur(5px)';
        div.style.border = '1px solid rgba(198,164,63,0.6)';
        div.style.whiteSpace = 'pre';
        const label = new CSS2DObject(div);
        label.position.set(x, y + 1.05, z);
        scene.add(label);
        
        const entity = { mesh, label, data: prod, baseScale: 1, hoverIntensity: 0 };
        productEntities.push(entity);
        productMap.set(prod.id, entity);
      });
    }
    
    // initial build
    let currentFilter = 'all';
    let currentSearch = '';
    buildWorldFromRegistry(currentFilter, currentSearch);
    
    // =========================================================================
    // ENGINE LAYER 4: INTERACTION PIPELINE (Raycaster + Hover/Focus)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let activeProductId = null;
    let isAnimatingCamera = false;
    let originalCameraPos = camera.position.clone();
    let originalTarget = controls.target.clone();
    
    function focusOnProduct(entity) {
      if (isAnimatingCamera) return;
      const targetPos = entity.mesh.position.clone().add(new THREE.Vector3(1.2, 0.8, 1.8));
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const endTarget = entity.mesh.position.clone();
      const duration = 650;
      const startTime = performance.now();
      isAnimatingCamera = true;
      function animateCamera(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1-t, 3);
        camera.position.lerpVectors(startPos, targetPos, ease);
        controls.target.lerpVectors(startTarget, endTarget, ease);
        controls.update();
        if (t < 1) requestAnimationFrame(animateCamera);
        else { isAnimatingCamera = false; activeProductId = entity.data.id; }
      }
      requestAnimationFrame(animateCamera);
    }
    
    function resetCameraFocus() {
      if (isAnimatingCamera) return;
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const endPos = new THREE.Vector3(6, 3.2, 9);
      const endTarget = new THREE.Vector3(0, 0.6, 0);
      const duration = 550;
      const startTime = performance.now();
      isAnimatingCamera = true;
      function animate(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1-t, 3);
        camera.position.lerpVectors(startPos, endPos, ease);
        controls.target.lerpVectors(startTarget, endTarget, ease);
        controls.update();
        if (t < 1) requestAnimationFrame(animate);
        else { isAnimatingCamera = false; activeProductId = null; }
      }
      requestAnimationFrame(animate);
    }
    
    // hover effect (engine layer: scale + light)
    let currentHoverEntity = null;
    function updateHoverEffect() {
      // continuous lerp for smoothness
      productEntities.forEach(ent => {
        let targetScale = (currentHoverEntity === ent) ? 1.08 : 1.0;
        ent.mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, 1), 0.2);
        if (ent.label) {
          const labelOpacity = (currentHoverEntity === ent) ? 1 : 0.85;
          ent.label.element.style.opacity = labelOpacity;
        }
      });
    }
    
    // click & hover detection (raycaster)
    window.addEventListener('click', (event) => {
      if (event.target.closest('.engine-ui') || event.target.closest('.engine-drawer')) return;
      mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
      mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = productEntities.map(e => e.mesh).filter(m => raycaster.intersectObject(m).length > 0);
      if (intersects.length > 0) {
        const hitEntity = productEntities.find(e => e.mesh === intersects[0]);
        if (hitEntity) focusOnProduct(hitEntity);
      } else {
        resetCameraFocus();
      }
    });
    
    // hover tracking (mousemove)
    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
      mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = productEntities.map(e => e.mesh).filter(m => raycaster.intersectObject(m).length > 0);
      if (intersects.length > 0) {
        const hit = productEntities.find(e => e.mesh === intersects[0]);
        currentHoverEntity = hit || null;
      } else {
        currentHoverEntity = null;
      }
    });
    
    // =========================================================================
    // ENGINE LAYER 5: STATE MANAGEMENT (Cart + Wishlist)
    // =========================================================================
    let cartItems = JSON.parse(localStorage.getItem('engine_cart') || '[]'); // { id, name, price, qty, img }
    let wishlistSet = new Set(JSON.parse(localStorage.getItem('engine_wish') || '[]'));
    
    function updateCounters() {
      const cartCount = cartItems.reduce((s,i) => s + i.qty, 0);
      document.getElementById('cartEngineBadge').innerText = cartCount;
      document.getElementById('wishEngineBadge').innerText = wishlistSet.size;
      renderCartUI();
      renderWishUI();
    }
    function saveCart() { localStorage.setItem('engine_cart', JSON.stringify(cartItems)); updateCounters(); }
    function saveWish() { localStorage.setItem('engine_wish', JSON.stringify(Array.from(wishlistSet))); updateCounters(); }
    
    function addToEngineCart(id) {
      const prod = productsData.find(p => p.id === id);
      if (!prod) return;
      const existing = cartItems.find(i => i.id === id);
      if (existing) existing.qty++;
      else cartItems.push({ id, name: prod.name, price: prod.price, qty: 1, img: prod.img });
      saveCart();
      // animated floating particle (visceral feedback)
      spawnFloatingText(`+1 ${prod.name}`);
    }
    function removeFromCart(id) { cartItems = cartItems.filter(i => i.id !== id); saveCart(); }
    function updateQty(id, delta) {
      const item = cartItems.find(i => i.id === id);
      if (item) { item.qty += delta; if (item.qty <= 0) removeFromCart(id); else saveCart(); }
    }
    function toggleEngineWish(id) {
      if (wishlistSet.has(id)) wishlistSet.delete(id);
      else wishlistSet.add(id);
      saveWish();
      spawnFloatingText(wishlistSet.has(id) ? '❤️ Saved' : '♡ Removed');
    }
    
    function renderCartUI() {
      const container = document.getElementById('engineCartList');
      if (cartItems.length === 0) { container.innerHTML = '<div style="color:#aaa;">Cart is empty</div>'; document.getElementById('engineCartTotal').innerHTML = 'Total: $0'; return; }
      let total = 0;
      container.innerHTML = cartItems.map(item => {
        total += item.price * item.qty;
        return `<div class="cart-item"><img src="${item.img}"><div><b>${item.name}</b><div>$${item.price}</div><div><button onclick="window.engineUpdateQty('${item.id}',-1)">-</button> ${item.qty} <button onclick="window.engineUpdateQty('${item.id}',1)">+</button> <button onclick="window.engineRemoveCart('${item.id}')" style="background:#444;">✕</button></div></div></div>`;
      }).join('');
      document.getElementById('engineCartTotal').innerHTML = `Total: $${total.toLocaleString()}`;
    }
    function renderWishUI() {
      const container = document.getElementById('engineWishList');
      const wishArr = Array.from(wishlistSet);
      if (wishArr.length === 0) { container.innerHTML = '<div style="color:#aaa;">No items saved</div>'; return; }
      const wishProducts = productsData.filter(p => wishlistSet.has(p.id));
      container.innerHTML = wishProducts.map(p => `<div class="wish-item"><img src="${p.img}"><div><b>${p.name}</b><div>$${p.price}</div><button onclick="window.engineToggleWish('${p.id}')" class="engine-btn-small">Remove</button></div></div>`).join('');
    }
    
    window.engineUpdateQty = (id, delta) => updateQty(id, delta);
    window.engineRemoveCart = (id) => removeFromCart(id);
    window.engineToggleWish = (id) => toggleEngineWish(id);
    
    function spawnFloatingText(msg) {
      const div = document.createElement('div');
      div.innerText = msg;
      div.style.position = 'fixed';
      div.style.bottom = '30%';
      div.style.left = '50%';
      div.style.transform = 'translateX(-50%)';
      div.style.backgroundColor = '#c6a43f';
      div.style.color = '#000';
      div.style.padding = '8px 18px';
      div.style.borderRadius = '40px';
      div.style.fontWeight = 'bold';
      div.style.zIndex = '200';
      div.style.fontSize = '0.8rem';
      div.style.animation = 'floatUp 1s ease forwards';
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 1000);
    }
    
    // Category + Search (rebuild world)
    function refreshWorld() {
      buildWorldFromRegistry(currentFilter, currentSearch);
      // reset hover and active state
      currentHoverEntity = null;
      if (!isAnimatingCamera) resetCameraFocus();
    }
    document.querySelectorAll('.cat-engine').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-engine').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-cat');
        refreshWorld();
      });
    });
    const searchField = document.getElementById('engineSearch');
    searchField.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      refreshWorld();
    });
    
    // UI drawers events
    document.getElementById('engineCartBtn').addEventListener('click', () => document.getElementById('engineCartDrawer').classList.add('open'));
    document.getElementById('engineWishBtn').addEventListener('click', () => document.getElementById('engineWishDrawer').classList.add('open'));
    document.getElementById('closeCartEngine').addEventListener('click', () => document.getElementById('engineCartDrawer').classList.remove('open'));
    document.getElementById('closeWishEngine').addEventListener('click', () => document.getElementById('engineWishDrawer').classList.remove('open'));
    document.getElementById('engineCheckoutBtn').addEventListener('click', () => alert(`Checkout (simulated) · Total: $${cartItems.reduce((s,i)=>s+(i.price*i.qty),0)}`));
    
    // =========================================================================
    // ENGINE RENDER LOOP (Continuous frame updates + hover interpolation)
    // =========================================================================
    let lastTime = performance.now();
    function engineRenderLoop() {
      requestAnimationFrame(engineRenderLoop);
      const now = performance.now();
      const delta = Math.min(1/30, (now - lastTime) / 1000);
      lastTime = now;
      
      // animate core rotating object
      coreObject.rotation.y += 0.008;
      coreObject.rotation.x = Math.sin(Date.now() * 0.002) * 0.1;
      particles.rotation.y += 0.002;
      particles.rotation.x = Math.sin(Date.now() * 0.0005) * 0.05;
      
      // dynamic hover effect (lerp scale)
      updateHoverEffect();
      
      controls.update(); // update damping
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    engineRenderLoop();
    
    // resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // initial UI sync
    updateCounters();
    console.log('3D Commerce Engine Initialized — Runtime interactive world active.');
  </script>
